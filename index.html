<body onload="startGame()">
  <div class="container">
        <div class="row">
            <div class="col-md-10 col-md-offset-1">
                <div id="canvas-container">
                </div>
            </div>
        </div>
    </div>
    <!-- Modal -->
<div id="myModal" class="modal fade" role="dialog">
    <div class="modal-dialog"> 
      <!-- Modal content-->
      <div class="modal-content">
        <div class="modal-header">
          <button type="button" class="close" data-dismiss="modal">&times;</button>
          <h4 class="modal-title">Game Over!</h4>
        </div>
        <div class="modal-body">
          <p>You died.  Game over.</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-default" data-dismiss="modal" onclick="location.reload()">Reset</button>
        </div>
      </div>  
    </div>
  </div>  
  <!--this button is hidden and solely used to trigger the modal upon a crash in the back endds-->
  <button style="display:none;" class="btn btn-default" type=button id="modal-trigger" data-toggle="modal" data-target="#myModal">Reset</button>
